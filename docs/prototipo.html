<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ortosend — Plantillas a medida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17262E; --ink2:#4A5A63; --mut:#8A968D;
  --teal:#0E6E5C; --teal-d:#0A5245; --teal-l:#E4F1EC;
  --paper:#F6F4EF; --card:#FFFFFF; --line:#E4E0D6;
  --amber:#B97324; --amber-l:#FBEFDD; --red:#B3372F; --red-l:#F9E7E5;
  --blue:#1E5FA8; --blue-l:#E7EFF9; --green:#2E7D32; --green-l:#E6F2E6;
  --r:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.55}
h1,h2,h3,.disp{font-family:'Sora',sans-serif}
a{color:var(--teal);text-decoration:none}
button{font-family:'Inter',sans-serif;font-size:14px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:var(--r);padding:9px 16px}
button:hover{border-color:var(--teal)}
button.pri{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
button.pri:hover{background:var(--teal-d)}
button.warn{background:var(--amber-l);border-color:var(--amber);color:var(--amber)}
button.dang{background:var(--red-l);border-color:var(--red);color:var(--red)}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font-family:'Inter',sans-serif;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff;width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal-l);border-color:var(--teal)}
label{font-size:13px;font-weight:500;color:var(--ink2);display:block;margin:12px 0 5px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.logo{font-family:'Sora';font-weight:700;font-size:19px;color:var(--ink)}
.logo b{color:var(--teal);font-weight:700}
.nav .links{display:flex;gap:18px;align-items:center;font-size:14px;flex-wrap:wrap}
.nav .links a{color:var(--ink2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--teal-l);color:var(--teal-d)}
.pill.a{background:var(--amber-l);color:var(--amber)}
.pill.r{background:var(--red-l);color:var(--red)}
.pill.b{background:var(--blue-l);color:var(--blue)}
.pill.g{background:var(--green-l);color:var(--green)}
.pill.n{background:#EEECE5;color:var(--ink2)}
.muted{color:var(--ink2);font-size:13px}
.tiny{color:var(--mut);font-size:12px}
.sp{height:18px}.sp2{height:34px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.hero{padding:56px 0 40px;text-align:center}
.hero h1{font-size:34px;line-height:1.2;margin-bottom:12px}
.hero p{max-width:520px;margin:0 auto 20px;color:var(--ink2)}
.price{display:inline-flex;align-items:baseline;gap:8px;background:var(--teal-l);border-radius:12px;padding:10px 20px;margin-bottom:22px}
.price b{font-family:'Sora';font-size:26px;color:var(--teal-d)}
.steps{display:flex;align-items:flex-start;gap:0;margin:10px 0 4px;overflow-x:auto;padding:16px 0 4px}
.step{flex:1;min-width:78px;text-align:center;position:relative}
.step .dot{width:26px;height:26px;border-radius:50% 50% 50% 4px;background:#EAE7DE;border:2px solid var(--line);margin:0 auto 7px;transform:rotate(-45deg)}
.step:nth-child(even) .dot{border-radius:50% 50% 4px 50%;margin-top:10px}
.step.done .dot{background:var(--teal);border-color:var(--teal)}
.step.cur .dot{background:#fff;border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-l)}
.step .lb{font-size:11.5px;color:var(--mut);line-height:1.3}
.step.done .lb,.step.cur .lb{color:var(--teal-d);font-weight:600}
.step:not(:last-child):after{content:'';position:absolute;top:12px;left:calc(50% + 16px);width:calc(100% - 32px);border-top:2px dotted var(--line)}
.step.done:not(:last-child):after{border-color:var(--teal)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line)}
tr.click{cursor:pointer}tr.click:hover{background:var(--paper)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{border:none;background:none;border-radius:8px 8px 0 0;padding:10px 14px;color:var(--ink2);white-space:nowrap}
.tabs button.on{color:var(--teal-d);font-weight:600;box-shadow:inset 0 -2px 0 var(--teal)}
.note{background:var(--blue-l);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--blue)}
.note.a{background:var(--amber-l);color:var(--amber)}
.note.g{background:var(--green-l);color:var(--green)}
.note.r{background:var(--red-l);color:var(--red)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-family:'Sora';font-size:22px;font-weight:600}
.kpi .l{font-size:12px;color:var(--mut)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:start}
.col{background:#EFEDE6;border-radius:var(--r);padding:8px}
.col h4{font-size:12px;color:var(--ink2);padding:2px 4px 8px}
.tcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:7px;cursor:pointer;font-size:13px}
.tcard:hover{border-color:var(--teal)}
.tcard .tiny{margin-top:2px}
.checkline{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;font-size:13.5px}
.checkline.ok{background:var(--green-l);border-color:#BFDCC0;color:var(--green)}
.slotbtn{border:1px solid var(--line);border-radius:8px;padding:8px 6px;font-size:13px;text-align:center}
.slotbtn.sel{background:var(--teal);color:#fff;border-color:var(--teal)}
.footer{border-top:1px solid var(--line);margin-top:60px;padding:26px 0;color:var(--mut);font-size:12.5px}
.modalbg{position:fixed;inset:0;background:rgba(23,38,46,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:24px}
.badge-demo{position:fixed;bottom:12px;right:12px;background:var(--ink);color:#fff;font-size:11px;padding:5px 10px;border-radius:99px;opacity:.75;z-index:60}
@media(max-width:640px){.hero h1{font-size:26px}.nav .links{gap:10px;font-size:13px}}
</style>
</head>
<body>
<div id="app"></div>
<div class="badge-demo">Prototipo Ortosend · datos simulados</div>
<script>
/* ============ ALMACENAMIENTO ============ */
let DB=null;
const DEFAULT_DB=()=>({
 users:[
  {email:'admin@ortosend.com',pass:'ortosend',role:'admin',name:'Administración Ortosend'},
  {email:'clinica@ortosend.com',pass:'ortosend',role:'admin_clinica',name:'Admin Clínica Girona',clinicId:'c1'},
  {email:'profesionalreceta@ortosend.com',pass:'ortosend',role:'profesional',prescriber:true,name:'Dra. Laia Serra (podóloga, col. 1234)',clinicId:'c1',colegiado:'COL-1234',titulacion:'Podología'},
  {email:'profesionalnoreceta@ortosend.com',pass:'ortosend',role:'profesional',prescriber:false,name:'Marc Vidal (técnico)',clinicId:'c1',titulacion:'Fisioterapia'},
  {email:'recetador@ortosend.com',pass:'ortosend',role:'recetador',prescriber:true,name:'Dr. Toni Bosch (podólogo, col. 5678)',colegiado:'COL-5678',titulacion:'Podología'},
  {email:'taller@ortosend.com',pass:'ortosend',role:'taller',name:'Taller Ortosend'}
 ],
 clinics:[
  {id:'c1',name:'Clínica Girona Centre',town:'Girona',cp:'17001',address:'C/ Nou 12, Girona',prescriber:true,active:true,slots:['Lun 10:00','Lun 12:30','Mié 09:30','Jue 16:00','Vie 11:00']},
  {id:'c2',name:'Centre Podològic Cassà',town:'Cassà de la Selva',cp:'17244',address:'Av. Pau Casals 3, Cassà',prescriber:false,active:true,slots:['Mar 10:00','Mar 17:30','Jue 10:30','Vie 09:00','Vie 12:00']},
  {id:'c3',name:'Clínica Llagostera Salut',town:'Llagostera',cp:'17240',address:'C/ Major 45, Llagostera',prescriber:false,active:true,slots:['Lun 09:00','Mié 11:00','Mié 17:00','Jue 12:30','Vie 10:00']}
 ],
 cases:[],applications:[],waitlist:[],incidents:[],seq:1041,activity:[]
});
async function loadDB(){
 try{const r=await window.storage.get('ortosend-db'); DB=JSON.parse(r.value);}
 catch(e){DB=DEFAULT_DB(); await seedDemo(); await saveDB();}
}
async function saveDB(){try{await window.storage.set('ortosend-db',JSON.stringify(DB));}catch(e){console.error('No se pudo guardar',e);}}
async function resetDB(){DB=DEFAULT_DB();await seedDemo();await saveDB();location.hash='#/';render();}
async function seedDemo(){
 // Caso demo en cola central (clínica sin prescriptor) para el recetador
 DB.cases.push(mkCase({id:'1039',patient:{name:'Pere Vidal',phone:'600111222',email:'pere@demo.com',birth:'1980-04-12'},clinicId:'c2',state:4,
  capture:fullCapture('Dolor en talón derecho al levantarse, 3 meses. Trabaja 8h de pie.'),
  history:[ev('Cita reservada (Flujo A)'),ev('Estudio completado por la clínica'),ev('Enviado a la cola central de prescripción')]}));
 // Caso demo del cliente ya en taller
 DB.cases.push(mkCase({id:'1024',patient:{name:'Jordi Ferrer',phone:'600333444',email:'jordi@demo.com',birth:'1975-09-02'},clinicId:'c1',state:8,phase:'confeccion',lot:'L-08',
  capture:fullCapture('Metatarsalgia bilateral, corredor habitual.'),
  prescription:{by:'Dra. Laia Serra (col. 1234)',date:new Date().toISOString(),diag:'Metatarsalgia mecánica bilateral',pauta:'Plantilla semirrígida con descarga retrocapital. Sin alza.',uso:'Adaptación progresiva 2-3 semanas. Apto para correr desde la semana 3.'},
  paid:true,delivery:'domicilio',
  history:[ev('Estudio completado'),ev('Prescrito por Dra. Serra'),ev('Pago recibido (simulado)'),ev('Aceptado por el taller'),ev('Diseño terminado'),ev('En fabricación — confección')]}));
 // Usuario cliente demo
 DB.users.push({email:'jordi@demo.com',pass:'ortosend',role:'cliente',name:'Jordi Ferrer',phone:'600333444'});
}
function ev(t){return {t,at:new Date().toISOString(),by:SES?SES.name:'sistema'}}
function mkCase(o){return Object.assign({id:String(DB.seq++),state:1,capture:{},history:[],createdAt:new Date().toISOString(),assignedTo:null,openBy:null,incidents:[]},o)}
function fullCapture(motivo){return {cuestionario:{motivo,dolor:'7/10',actividad:'Activo'},exploracion:{tobillo:'Limitada rodilla extendida (gastrocnemios)',dismetria:'No',alza:'No'},escaneoL:true,escaneoR:true,videos:[1,1,1,1,1,1,1],baroEst:2,baroDin:true,baroFile:true}}
/* ============ SESIÓN Y ESTADOS ============ */
let SES=null; let Q='';
function setSes(u){SES=u;}
function logout(){releaseAllBy(SES&&SES.email);saveDB();SES=null;location.hash='#/';render()}
const STATES={1:'Cita reservada',2:'Estudio en curso',3:'Estudio completo',4:'En prescripción',5:'Pendiente de pago',6:'Entrada taller',7:'Diseño',8:'Fabricación',9:'Control de calidad',10:'Enviado',11:'Entregado / cerrado',R:'Devuelto a clínica',N:'No prescrito',C:'En valoración (contacto)'};
const STCOLOR={1:'b',2:'a',3:'b',4:'a',5:'a',6:'n',7:'b',8:'b',9:'a',10:'g',11:'g',R:'r',N:'r',C:'a'};
function stpill(s){return `<span class="pill ${STCOLOR[s]||'n'}">${STATES[s]||s}</span>`}
function clinic(id){return DB.clinics.find(c=>c.id===id)}
function fmtd(iso){return new Date(iso).toLocaleDateString('es-ES',{day:'numeric',month:'short'})}
function releaseAllBy(email){if(!DB)return;DB.cases.forEach(c=>{if(c.openBy===email)c.openBy=null})}
function pushEv(c,t){c.history.push(ev(t))}
/* ============ ROUTER ============ */
window.addEventListener('hashchange',render);
window.addEventListener('load',async()=>{await loadDB();render();});
function nav(){
 const pub=`<a href="#/como">Cómo funciona</a><a href="#/buscar">Buscar clínica</a><a href="#/clinicas">Para clínicas</a>`;
 const who=SES?`<span class="tiny">${SES.name.split('(')[0]}</span><button onclick="logout()">Salir</button>`:`<a href="#/login"><button>Acceder</button></a>`;
 const panel=SES?`<a href="#/panel"><button class="pri">Mi panel</button></a>`:'';
 return `<div class="nav"><div class="wrap"><a href="#/" class="logo">orto<b>send</b></a><div class="links">${SES?'':pub}${panel}${who}</div></div></div>`;
}
function render(){
 const h=location.hash||'#/'; const app=document.getElementById('app');
 if(!DB){app.innerHTML='Cargando…';return}
 let v='';
 if(h==='#/') v=vHome();
 else if(h==='#/como') v=vComo();
 else if(h==='#/buscar') v=vBuscar();
 else if(h.startsWith('#/reserva/')) v=vReserva(h.split('/')[2]);
 else if(h==='#/clinicas') v=vParaClinicas();
 else if(h==='#/login') v=vLogin();
 else if(h==='#/panel') v=vPanel();
 else if(h.startsWith('#/caso/')) v=vCaso(h.split('/')[2]);
 else v=vHome();
 app.innerHTML=nav()+v+`<div class="footer"><div class="wrap row between"><span>© 2026 Ortosend · Prototipo funcional</span><span><a onclick="resetDB()" style="cursor:pointer">Reiniciar datos de demo</a></span></div></div>`;
}
/* ============ WEB PÚBLICA ============ */
function vHome(){
 return `<div class="wrap"><div class="hero">
 <h1>Plantillas a medida, sin sorpresas</h1>
 <p>Estudio completo de la pisada en una clínica cerca de ti — escáner 3D, análisis de la marcha y baropodometría. Solo pagas si un profesional colegiado prescribe tu tratamiento.</p>
 <div class="price"><b>199,99 €</b><span class="muted">precio único, todo incluido</span></div>
 <div class="row" style="max-width:460px;margin:0 auto;justify-content:center">
   <input id="hcp" placeholder="Tu código postal o población" style="flex:1;min-width:200px">
   <button class="pri" onclick="doSearch()">Buscar clínica</button>
 </div>
 <div class="tiny" style="margin-top:10px">Te mostramos las clínicas asociadas en un radio de 50 km · Recibe tus plantillas en 5 días laborables desde el pago</div>
 </div>
 <div class="grid g4">
  ${[['1. Reserva tu cita','Gratis y sin compromiso, en la clínica que elijas.'],['2. Estudio completo','Escaneo 3D, vídeos de marcha y presiones plantares.'],['3. Prescripción y pago','Un profesional colegiado valida tu caso. Solo entonces pagas, online y de forma segura.'],['4. Recibe tus plantillas','En 5 días laborables, en casa o en tu clínica. Revisión anual incluida.']].map(x=>`<div class="card"><b style="font-family:Sora;font-size:14px">${x[0]}</b><div class="muted" style="margin-top:6px">${x[1]}</div></div>`).join('')}
 </div>
 <div class="sp2"></div>
 <div class="card row between"><div><b style="font-family:Sora">¿Tienes una clínica?</b><div class="muted">Únete a la red Ortosend: te cedemos el equipamiento y te enviamos pacientes.</div></div><a href="#/clinicas"><button>Asóciate</button></a></div>
 </div>`;
}
function vComo(){
 return `<div class="wrap"><div class="sp2"></div><h2>Cómo funciona Ortosend</h2><div class="sp"></div>
 <div class="grid g2">
 <div class="card"><b>El estudio</b><p class="muted" style="margin-top:6px">En tu clínica asociada te hacen un estudio completo: escaneo 3D de ambos pies, cuestionario y exploración física, vídeos de tu marcha desde tres ángulos y análisis de presiones plantares. Dura unos 45 minutos. Trae tu calzado habitual.</p></div>
 <div class="card"><b>La prescripción</b><p class="muted" style="margin-top:6px">Un podólogo o médico colegiado — de tu clínica o de nuestro equipo — valora tu estudio y firma tu prescripción, explicando qué necesitas y por qué. Si necesita aclarar algo, te llamará. Y si no está indicado el tratamiento, te lo diremos con la misma claridad: no pagas nada.</p></div>
 <div class="card"><b>El pago</b><p class="muted" style="margin-top:6px">Solo con la prescripción firmada recibes el enlace de pago: 199,99 €, con tarjeta o Bizum, siempre a través de Ortosend. Nunca pagarás nada en la clínica. El enlace es válido 30 días.</p></div>
 <div class="card"><b>Tus plantillas</b><p class="muted" style="margin-top:6px">Fabricamos el molde a partir de tu escaneo 3D y confeccionamos tus plantillas a mano. En 5 días laborables las recibes en casa o en tu clínica. Incluyen guía de adaptación (2-3 semanas de uso progresivo) y revisión anual.</p></div>
 </div></div>`;
}
function doSearch(){
 const q=(document.getElementById('hcp').value||'').trim().toLowerCase();
 Q=q; location.hash='#/buscar'; setTimeout(render,0);
}
function vBuscar(){
 const q=(Q||'').toLowerCase();
 let res=DB.clinics.filter(c=>c.active);
 if(q) res=res.filter(c=>c.cp.startsWith(q.slice(0,2))||c.town.toLowerCase().includes(q)||c.cp===q);
 const none=q&&res.length===0;
 return `<div class="wrap"><div class="sp2"></div><h2>Clínicas asociadas cerca de ti</h2>
 <div class="row" style="margin:14px 0"><input id="hcp" value="${q}" placeholder="Código postal o población" style="max-width:280px"><button class="pri" onclick="doSearch()">Buscar</button><button onclick="Q='1';location.hash='#/buscar';render()">Usar mi ubicación (simulado)</button></div>
 ${none?`<div class="card"><b>Aún no llegamos a tu zona</b><p class="muted" style="margin:8px 0">Déjanos tu contacto y te avisaremos cuando haya una clínica asociada cerca.</p><div class="row"><input id="wl" placeholder="Tu móvil o email" style="max-width:260px"><button class="pri" onclick="addWait('${q}')">Avisadme</button></div></div>`:''}
 <div class="grid g3" style="margin-top:10px">${res.map(c=>`<div class="card"><b style="font-family:Sora">${c.name}</b><div class="muted">${c.address}</div><div class="tiny" style="margin:6px 0">${c.prescriber?'Prescriptor en la propia clínica':'Prescripción por el equipo Ortosend'}</div><a href="#/reserva/${c.id}"><button class="pri" style="width:100%">Reservar cita gratis</button></a></div>`).join('')}</div>
 <div class="sp"></div><div class="note">Mapa interactivo con las clínicas: en el prototipo se muestra como lista. En la versión final irá con mapa (Leaflet/Google) y radio de 50 km real.</div></div>`;
}
function addWait(zone){const v=document.getElementById('wl').value;if(!v)return alert('Escribe un contacto');DB.waitlist.push({zone,contact:v,at:new Date().toISOString()});saveDB();alert('Apuntado. Te avisaremos.');}
/* ---- Reserva Flujo A ---- */
let RSV={};
function vReserva(cid){
 const c=clinic(cid); if(!c) return '<div class="wrap"><p>Clínica no encontrada</p></div>';
 RSV.clinicId=cid;
 return `<div class="wrap" style="max-width:640px"><div class="sp2"></div>
 <h2>Reserva tu cita — ${c.name}</h2><div class="muted">${c.address} · La cita y el estudio son gratuitos. Solo pagarás si un profesional prescribe tu tratamiento.</div><div class="sp"></div>
 <div class="card"><b>1. Elige tu hora</b><div class="grid g4" style="margin-top:10px">${c.slots.map((s,i)=>`<div class="slotbtn ${RSV.slot===s?'sel':''}" onclick="RSV.slot='${s}';render()">${s}</div>`).join('')}</div>
 ${c.slots.length===0?'<div class="note a" style="margin-top:8px">Esta clínica no tiene huecos publicados ahora mismo.</div>':''}</div>
 <div class="sp"></div>
 <div class="card"><b>2. Tus datos</b>
 <label>Nombre y apellidos</label><input id="rn" value="${RSV.name||''}">
 <div class="grid g2"><div><label>Móvil (será tu vía de contacto por WhatsApp)</label><input id="rp" value="${RSV.phone||''}"></div><div><label>Email</label><input id="re" value="${RSV.email||''}"></div></div>
 <div class="grid g2"><div><label>Fecha de nacimiento</label><input id="rb" type="date"></div><div><label>Motivo (opcional)</label><select id="rm"><option>Dolor</option><option>Deporte</option><option>Prevención / revisión</option><option>Renovación de plantillas</option></select></div></div>
 <label>Crea tu contraseña (para seguir tu tratamiento en tu panel)</label><input id="rw" type="password">
 <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input type="checkbox" id="rc1" style="width:auto;margin-top:3px"> Consiento el tratamiento de mis datos de salud para la prestación del servicio (RGPD).</label>
 <label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input type="checkbox" id="rc2" style="width:auto;margin-top:3px"> Acepto recibir comunicaciones del servicio por WhatsApp.</label>
 </div><div class="sp"></div>
 <button class="pri" style="width:100%" onclick="confirmReserva()">Confirmar reserva gratuita</button>

 let body='';
 if(c.state===1) body=`<b>Tu cita: ${c.slot||''}</b><div class="muted">${cl.name} · ${cl.address}. Trae tu calzado habitual y ropa cómoda.</div><div class="row" style="margin-top:10px"><button onclick="alert('Reprogramación: en la versión final, aquí eliges otro hueco.')">Reprogramar</button><button class="dang" onclick="alert('Cancelación registrada (simulada).')">Cancelar</button></div>`;
 else if(c.state<=4&&c.state>=2) body=`<b>Tu estudio está completo</b><div class="muted">Nuestro equipo lo está valorando. Te avisaremos por WhatsApp en un máximo de 48 h laborables.</div>`;
 else if(c.state==='C') body=`<b>Un profesional quiere hablar contigo</b><div class="muted">El podólogo que valora tu caso te llamará para aclarar un par de cuestiones antes de la prescripción.</div>`;

 else if(c.state==='N') body=`<b>Tu valoración está completa</b><div class="muted">Nuestro equipo ha estudiado tu caso y el tratamiento con plantillas no está indicado. No se te cobrará nada. ${c.noReason?('Recomendación: '+c.noReason):''}</div>`;
 else if(c.state===5) body=`<b>Tu prescripción está lista</b><div class="muted">Firmada por ${c.prescription.by}. Revisa el documento y completa el pago para iniciar la fabricación. Enlace válido 30 días.</div>

 else if(c.state>=6&&c.state<=9) body=`<b>Tus plantillas se están fabricando</b><div class="muted">Mecanizamos el molde a partir de tu escaneo 3D y las confeccionamos a mano. Entrega estimada: 5 días laborables desde tu pago.</div><div class="row" style="margin-top:10px"><button onclick="showRx('${c.id}')">Ver mi prescripción</button></div>`;
 else if(c.state===10) body=`<b>¡En camino!</b><div class="muted">${c.delivery==='clinica'?('Enviadas a tu clínica ('+cl.name+'). Te avisarán para recogerlas.'):('Seguimiento: '+(c.tracking||'—')+'.')}</div>`;
 else if(c.state===11) body=`<b>Entregadas — guía de adaptación</b><div class="muted">Uso progresivo 2-3 semanas, con calzado cerrado. Ajuste casero: el material es termofusible (truco del secador según tu manual). Vida útil orientativa: 2-4 años / ~800 km. Tu revisión anual queda programada — te avisaremos.</div><div class="row" style="margin-top:10px"><button onclick="showRx('${c.id}')">Mis documentos</button></div>`;
 return `<div class="card"><div class="row between"><b style="font-family:Sora">Tratamiento #${c.id}</b>${stpill(c.state)}</div>${stepsHtml}${body}<div class="tiny" style="margin-top:12px">¿Dudas? Escríbenos por WhatsApp (canal principal de Ortosend).</div></div>`;
}

function vCaso(id){

 if(!SES) {location.hash='#/login';return vLogin();}
 const isClinicStaff=(SES.role==='admin_clinica'||SES.role==='profesional')&&SES.clinicId===c.clinicId;
 const isClinicRx=isClinicStaff&&SES.prescriber&&(c.state===4||c.state==='C')&&clinic(c.clinicId).prescriber;

 let inner='';

}

async function wSave(id,k){const c=DB.cases.find(x=>x.id===id);
 if(k==='q'){if(!rv('wq1'))return alert('Falta el motivo');c.capture.cuestionario={motivo:rv('wq1'),dolor:rv('wq2'),actividad:rv('wq3')};}
 if(k==='e'){c.capture.exploracion={tobillo:rv('we1'),dismetria:rv('we2'),alza:rv('we3')||'No'};}
 c.state=Math.max(c.state,2);await saveDB();render();}

async function wVid(id,i){const c=DB.cases.find(x=>x.id===id);c.capture.videos=c.capture.videos||[0,0,0,0,0,0,0];c.capture.videos[i]=1;c.state=Math.max(c.state,2);await saveDB();render();}

  <div class="sp"></div><div class="row"><button onclick="hojaTrabajo('${c.id}')">Hoja de trabajo</button><button class="pri" onclick="tGo('${c.id}',9,'Confección terminada — a control de calidad')">Terminado → calidad</button></div>`}`;
 if(c.state===9) zone=`<b>Control de calidad</b>
  ${['Medidas conformes al diseño','Acabados y pulido','Marcado I/D correcto','Etiquetado del par','Foto del par adjunta (obligatoria)'].map(x=>`<div class="checkline">○ ${x}</div>`).join('')}
  <div class="row" style="margin-top:10px"><button onclick="alert('Foto del par adjuntada (simulada)')">Adjuntar foto</button><button class="pri" onclick="tGo('${c.id}',10,'Calidad superada — preparado para envío')">Calidad OK → envío</button><button class="warn" onclick="tInc('${c.id}','rehacer por defecto')">No pasa → rehacer</button></div>`;
 if(c.state===10) zone=`<b>Envío</b>
  <div class="muted">Destino: ${c.delivery==='clinica'?('Recogida en clínica — '+clinic(c.clinicId).name+' ('+clinic(c.clinicId).address+')'):('Domicilio del paciente')}</div>
  <div class="row" style="margin-top:10px"><button onclick="tShip('${c.id}')">Generar etiqueta + marcar enviado</button><button class="pri" onclick="tGo('${c.id}',11,'Entrega confirmada. Inicia periodo de adaptación (seguimiento día 20) y queda programada la revisión anual')">Confirmar entrega</button></div>
  ${c.tracking?`<div class="tiny" style="margin-top:8px">Seguimiento: ${c.tracking}</div>`:''}`;
 return `<div class="note a">Caso asociado a ti hasta completar la fase, soltarlo o cerrar sesión. <a onclick="tRelease('${c.id}')" style="cursor:pointer">Soltar caso</a></div><div class="sp"></div>
 <div class="grid g2"><div>${expediente(c)}</div><div class="card">${zone}</div></div>${historial(c)}`;
}
async function tGo(id,st,msg){const c=DB.cases.find(x=>x.id===id);c.state=st;c.openBy=null;if(document.getElementById('tl'))c.lot=rv('tl');if(document.getElementById('tm'))c.material=rv('tm');pushEv(c,msg);await saveDB();
 if(st===11)alert('[WhatsApp simulado → paciente]\\n¡Entregadas! Recuerda: adaptación progresiva 2-3 semanas. Te preguntaremos qué tal en unos días.');
 location.hash='#/panel';}
async function tPhase(id){const c=DB.cases.find(x=>x.id===id);c.phase='confeccion';c.lot=rv('tl');pushEv(c,'Molde mecanizado ('+c.lot+') — pasa a confección');await saveDB();render();}
async function tShip(id){const c=DB.cases.find(x=>x.id===id);c.tracking='TRK-'+id+'-ES';pushEv(c,'Enviado — seguimiento '+c.tracking);await saveDB();
 alert('[WhatsApp simulado → paciente]\\n'+(c.delivery==='clinica'?'Tus plantillas van de camino a tu clínica; te avisarán para recogerlas.':'Tus plantillas están en camino. Seguimiento: '+c.tracking));render();}
async function tRelease(id){const c=DB.cases.find(x=>x.id===id);c.openBy=null;pushEv(c,'Caso soltado a la cola');await saveDB();location.hash='#/panel';}
async function tInc(id,type){const c=DB.cases.find(x=>x.id===id);
 const note=prompt('Motivo de la incidencia:')||type;
 DB.incidents.push({caseId:id,type,note,at:new Date().toISOString(),closed:false});
 if(type==='captura inválida'){c.state='R';c.repeatWhat='captura (ver incidencia)';c.repeatReason=note;pushEv(c,'Incidencia de captura — devuelto a clínica sin coste para el cliente');}
 else{c.state=7;pushEv(c,'Incidencia: '+note+' — vuelve a diseño/fabricación con prioridad');}
 c.openBy=null;await saveDB();alert('Incidencia registrada, vinculada al caso #'+id);location.hash='#/panel';}
function hojaTrabajo(id){
 const c=DB.cases.find(x=>x.id===id);const p=c.prescription||{};const alza=(c.capture.exploracion||{}).alza;
 modal(`<h3>Hoja de trabajo — caso #${c.id}</h3><div class="tiny">Acompaña físicamente al par por el taller · QR al caso · 2 etiquetas de molde (I / D)</div><hr style="border:none;border-top:1px solid var(--line);margin:12px 0">
 <p><b>Paciente:</b> ${c.patient.name} · <b>Clínica:</b> ${clinic(c.clinicId).name}</p>
 <p><b>El problema:</b> ${p.diag||'—'}. ${p.val||''}</p>
 <p><b>Modificaciones a ejecutar:</b><br>${p.pauta||'—'}${alza&&alza!=='No'?'<br><b>ALZA: '+alza+'</b>':''}</p>
 <p class="tiny">Prescripción firmada por ${p.by||'—'} · Fases: mecanizado CNC → confección a mano → calidad → envío</p>`);
}
</script>
