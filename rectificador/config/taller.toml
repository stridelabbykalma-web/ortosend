# Datos fijos del taller. Cambiar solo si cambia la máquina, la fresa o el bloque.
# Unidades: milímetros.

[recuadro]
# Medidas del recuadro que entrega el script de limpieza (los dos pies juntos).
# X = ancho (los dos pies lado a lado), Y = largo (dirección talón-dedos).
# PENDIENTE: confirmar con un STL real cuál de los dos ejes mide 330.
ancho_x = 288.0
largo_y = 330.0
# Altura disponible del bloque de espuma: nada puede quedar por encima.
alto_z = 38.0

[fresa]
# Fresa de punta de bola. Ningún hueco puede tener un radio menor que este.
diametro = 12.0

[calculo]
# Separación entre puntos de la rejilla de alturas. Más pequeño = más detalle y más lento.
rejilla = 0.5

[fusion]
# Fusion 360 del taller: unidades en cm y como máximo 10.000 triángulos por malla.
max_triangulos = 10000
# Margen de seguridad por debajo del máximo.
objetivo_triangulos = 9500
escala = 0.1

[limpieza]
# Limpieza del escaneo en bruto del Revopoint (los dos bloques con la huella hundida).
# Medidas de un bloque de espuma: los dos juntos forman el recuadro.
bloque_ancho = 144.0
bloque_largo = 330.0
# Grosor de base plana que se deja debajo del pie en el molde. PROVISIONAL: confirmar.
base = 3.0
# Profundidad a partir de la cual se considera que hay huella (mm).
umbral_huella = 1.5
# Área mínima de una huella para contar como pie (mm²).
area_minima_pie = 3000.0
# Se amplía la huella este margen para no cortar el borde del pie (mm).
margen_huella = 3.0
# Suavizado del ruido del escáner (mm). 0 = sin suavizar.
suavizado = 0.5
# Tolerancia para detectar la cara superior plana de los bloques (mm).
tolerancia_plano = 0.6
# En qué mitad del recuadro va el pie izquierdo: "izquierda" (X pequeñas) o "derecha".
pie_izquierdo_en = "izquierda"

[lijado]
# Lijado del molde: quita impurezas (hoyitos, bultitos, ondulaciones, marcas) como si se
# hubiera lijado, conservando la forma del pie y su contorno. El valor es el tamaño del
# "taco de lija" en mm: más grande = lija ondulaciones más anchas. 0 = sin lijar.
# Se puede cambiar en la ventana.
taco = 6.0

[cnc]
# Salida directa para la CNC (Two Trees TTC 6050, controlador GRBL, archivo .nc por USB/tarjeta).
# Origen del trabajo: X0 Y0 en la esquina DELANTERA IZQUIERDA del bloque, Z0 en su cara de ARRIBA.
# Todos los valores de velocidad son PROVISIONALES y prudentes para ESCAYOLA: ajustar tras la 1.ª prueba.
material = "escayola"
revoluciones = 10000         # rpm del cabezal (si la máquina no las controla, se ignora)
avance_desbaste = 1200       # mm/min
avance_acabado = 1800        # mm/min
avance_bajada = 300          # mm/min al bajar en vertical dentro del material
avance_rapido = 3000         # mm/min (solo para estimar el tiempo; los G0 los hace la máquina)
bajada_por_pasada = 10.0     # mm que baja cada capa del desbaste (1 cm: quita lo grande rápido)
paso_desbaste = 5.0          # mm entre pasadas del desbaste (menos que el radio de la bola)
sobrante_desbaste = 0.5      # mm que deja el desbaste para el acabado
cresta_acabado = 0.05        # mm: altura máxima de las crestas que deja el acabado (más pequeño = más liso y más lento)
altura_seguridad = 5.0       # mm por encima del bloque para moverse en rápido
# Disposición (los pies lo más juntos posible):
margen_pie = 10.0            # mm de base plana alrededor de cada pie
margen_bloque = 5.0          # mm desde los pies (con su margen) al borde de la plancha
separacion = 6.0             # mm de escayola sin tocar entre pie y pie (para poder cortarlos después)
permitir_giro = true         # girar pies 90/180/270° si así caben más

[plancha]
# Plancha de escayola para una tirada (varios moldes a la vez). Se puede cambiar en cada tirada.
# Por defecto, la mesa de la Two Trees TTC 6050. Origen: esquina delantera izquierda, arriba.
ancho_x = 600.0
largo_y = 500.0
alto_z = 40.0
