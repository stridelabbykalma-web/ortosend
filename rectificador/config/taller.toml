# Datos fijos del taller. Cambiar solo si cambia la máquina, la fresa o el bloque.
# Unidades: milímetros.

[recuadro]
# Medidas del recuadro que entrega el script de limpieza (los dos pies juntos).
# X = ancho (los dos pies lado a lado), Y = largo (dirección talón-dedos).
# PENDIENTE: confirmar con un STL real cuál de los dos ejes mide 330.
ancho_x = 288.0
largo_y = 330.0
# Altura disponible del bloque de espuma: nada puede quedar por encima.
alto_z = 38.0

[fresa]
# Fresa de punta de bola (la del ejemplo de Fusion: T1 D=25 CR=12.5).
# Ningún hueco puede tener un radio menor que este.
diametro = 25.0

[calculo]
# Separación entre puntos de la rejilla de alturas. Más pequeño = más detalle y más lento.
rejilla = 0.5

[fusion]
# Fusion 360 del taller: unidades en cm y como máximo 10.000 triángulos por malla.
max_triangulos = 10000
# Margen de seguridad por debajo del máximo.
objetivo_triangulos = 9500
escala = 0.1

[limpieza]
# Limpieza del escaneo en bruto del Revopoint (los dos bloques con la huella hundida).
# Medidas de un bloque de espuma: los dos juntos forman el recuadro.
bloque_ancho = 144.0
bloque_largo = 330.0
# Grosor de base plana que se deja debajo del pie en el molde. PROVISIONAL: confirmar.
base = 3.0
# Profundidad a partir de la cual se considera que hay huella (mm).
umbral_huella = 1.5
# Área mínima de una huella para contar como pie (mm²).
area_minima_pie = 3000.0
# Se amplía la huella este margen para no cortar el borde del pie (mm).
margen_huella = 3.0
# Suavizado del ruido del escáner (mm). 0 = sin suavizar.
suavizado = 0.5
# Tolerancia para detectar la cara superior plana de los bloques (mm).
tolerancia_plano = 0.6
# En qué mitad del recuadro va el pie izquierdo: "izquierda" (X pequeñas) o "derecha".
pie_izquierdo_en = "izquierda"

[lijado]
# Lijado del molde: quita impurezas (hoyitos, bultitos, ondulaciones, marcas) como si se
# hubiera lijado, conservando la forma del pie y su contorno. El valor es el tamaño del
# "taco de lija" en mm: más grande = lija ondulaciones más anchas. 0 = sin lijar.
# Se puede cambiar en la ventana.
taco = 6.0

[cnc]
# Salida directa para la CNC (Two Trees TTC 6050, archivo .nc por USB/tarjeta), con la misma
# estrategia y formato que el ejemplo de Fusion del taller (molde_yeso.nc).
# Origen del trabajo: X0 Y0 en la esquina DELANTERA IZQUIERDA de la plancha, Z0 en su cara de ARRIBA.
# Velocidades copiadas del ejemplo de Fusion (escayola): ajustar tras la 1.ª prueba si hace falta.
material = "escayola"
revoluciones = 10000         # rpm del cabezal
avance_desbaste = 2500       # mm/min cortando en el contorno y el desbaste
avance_entrada = 1500        # mm/min al entrar en el material y al cambiar de línea
avance_bajada = 800          # mm/min al bajar en vertical dentro del material
avance_acabado = 3000        # mm/min en el acabado
avance_rapido = 3000         # mm/min (solo para estimar el tiempo; los G0 los hace la máquina)
altura_seguridad = 15.0      # mm sobre la plancha para ir de un pie a otro (como Fusion)
altura_paso = 2.0            # mm sobre la plancha para saltar dentro de un mismo pie
rebaje_superior = 0.5        # mm por debajo de la cara de arriba queda lo más alto del pie
# 1) Contorno: rodea la silueta del pie (pared vertical, sin base plana alrededor).
contorno = true
bajada_contorno = 3.0        # mm que baja por cada vuelta
suelo_contorno = 7.5         # mm de escayola que quedan debajo de la ranura (Fusion: 40 - 32,5)
suelo_minimo = 3.0           # si el pie es muy alto se deja menos suelo, pero nunca menos de esto
# 2) Desbaste por capas dentro de la silueta.
bajada_por_pasada = 5.0      # mm que baja cada capa
paso_desbaste = 7.0          # mm entre líneas del desbaste (con la bola de 25 deja crestas de 0,5 mm)
sobrante_desbaste = 0.5      # mm que deja el desbaste para el acabado
# 3) Acabado en líneas paralelas a X.
paso_acabado = 1.75          # mm entre líneas (con la bola de 25 deja crestas de 0,03 mm)
# Disposición (los pies lo más juntos posible):
margen_bloque = 0.0          # mm extra desde la ranura de cada pie al borde de la plancha
separacion = 0.0             # mm extra entre las ranuras de dos pies vecinos
permitir_giro = true         # girar pies 90° si así caben más

[plancha]
# Plancha de escayola para una tirada (varios moldes a la vez). Se puede cambiar en cada tirada.
# Por defecto, la mesa de la Two Trees TTC 6050. Origen: esquina delantera izquierda, arriba.
ancho_x = 600.0
largo_y = 500.0
alto_z = 40.0
