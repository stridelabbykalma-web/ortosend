# VALORES CLÍNICOS POR DEFECTO — PROVISIONALES, a revisar por el podólogo.
# Todo en milímetros salvo que se indique otra cosa.
# Las alturas se escriben pensando en la PLANTILLA (como se prescriben).
# El programa se encarga de invertirlas al aplicarlas al molde.
#
# Estos valores solo se usan al AÑADIR una pieza nueva. Después cada pieza
# guarda sus propios valores en la receta del paciente.

[general]
# Ancho de la transición suave en el borde de las piezas (sin escalones).
suavizado_borde = 8.0

[recorte_arco]
# El molde termina en un arco este número de mm por delante de las cabezas metatarsales (siguiendo su curva).
adelanto = 15.0
# 1.0 = sigue la parábola metatarsal tal cual; 0 = recta; >1 = más curvada.
curvatura = 1.0
# Parábola metatarsal: cuánto sobresale (mm) el punto más adelantado (2.º-3.er MTT) por
# delante de la línea 1.er-5.º MTT, con curvatura 1. PROVISIONAL.
flecha = 10.0
# Dónde está ese punto más adelantado, de 0 (1.er MTT) a 1 (5.º MTT). PROVISIONAL.
posicion_vertice = 0.35

[relleno_arco]
# Relleno del arco interno. Altura en la PLANTILLA:
#   sentido = "rebajar" (clásico): se añade escayola al arco del molde y la plantilla queda con menos arco.
#   sentido = "subir": se quita escayola del molde y la plantilla queda con más arco.
# Se cambia en cada paciente.
altura = 3.0
sentido = "rebajar"
largo = 70.0
ancho = 35.0

[oliva]
# Oliva retrocapital (bulto en la plantilla = hueco en el molde): centrada entre 2.º y 3.er MTT,
# por detrás de la línea metatarsal.
altura = 5.0
largo = 25.0
ancho = 20.0
# Distancia del centro de la oliva por detrás de las cabezas.
retraso = 8.0

[barra_metatarsal]
# Barra metatarsal (bulto transversal en la plantilla = hueco en el molde) bajo todas las cabezas
# (1.ª a 5.ª), de borde a borde del pie, curvada como el recorte (parábola metatarsal) y por detrás.
# Misma altura de lado a lado.
altura = 5.0
# Ancho de la barra medido a lo largo del pie.
ancho = 20.0
# Distancia del centro de la barra por detrás de las cabezas.
retraso = 8.0

[descarga_1mtt]
# Hueco en la plantilla bajo la cabeza del 1.er MTT (se añade escayola al molde).
profundidad = 2.0
diametro = 20.0

[descarga_5mtt]
# Hueco en la plantilla bajo la cabeza del 5.º MTT (se añade escayola al molde).
profundidad = 2.0
diametro = 20.0

[descarga_sesamoideos]
# Hueco bajo los sesamoideos (bajo la 1.ª cabeza, un poco por detrás).
profundidad = 2.0
largo = 22.0
ancho = 16.0

[descarga_espolon]
# Hueco bajo el tubérculo medial del calcáneo (espolón).
profundidad = 3.0
diametro = 25.0

[soporte_navicular]
# Bulto bajo el escafoides (se quita escayola del molde).
altura = 3.0
largo = 30.0
ancho = 22.0

[soporte_cuboides]
# Bulto bajo el cuboides, columna lateral (se quita escayola del molde).
altura = 3.0
largo = 30.0
ancho = 22.0

[canal_fascia]
# Surco en la plantilla para la fascia plantar, del tubérculo medial del calcáneo hasta ~10 mm por
# detrás de la 1.ª cabeza (se añade una tira de escayola al molde).
profundidad = 4.0
ancho = 15.0

[skive]
# Skive de Kirby: corte en plano inclinado `angulo` grados en el plano frontal. La profundidad (2, 4 o 6 mm)
# se mide a 1/3 del ancho del talón desde el borde medial (varo) o lateral (valgo). Con 2 mm solo toca el
# lado del corte; con 6 mm cruza toda la cazoleta. Va desde atrás hasta el borde anterior de la cazoleta.
altura = 4.0
sentido = "varo"
angulo = 15.0
largo = 55.0

[cuna_posterior]
# Cuña intrínseca de retropié (grados): varo = supinadora, valgo = pronadora. Zona del talón.
grados = 4.0
sentido = "varo"
largo = 60.0

[cuna_anterior]
# Cuña intrínseca de antepié (grados), desde `largo` mm por detrás de las cabezas hacia delante.
grados = 4.0
sentido = "varo"
largo = 45.0

[alza_talon]
# Alza de talón: igual bajo el talón y rampa suave hasta `largo` mm desde atrás.
altura = 5.0
largo = 120.0

[expansion_talon]
# Expansión de talón: el talón se ensancha este porcentaje (se añade escayola en la periferia).
porcentaje = 10.0
largo = 60.0

[referencias]
# Tamaño de las correcciones según el pie: los largos y anchos de arriba son para un pie medio, que mide
# esto del talón al punto entre la 2.ª y la 3.ª cabeza (≈ talla 40). En un pie más pequeño o más grande
# se escalan en proporción (sin pasar de estos límites). La altura no cambia.
pie_medio = 175.0
escala_minima = 0.6
escala_maxima = 1.4
# El eje del pie va del talón al punto medio entre la 2.ª y la 3.ª cabeza metatarsal.
# Si no están marcadas, sale de la línea 1.ª-5.ª a esta fracción (0 = 1.ª, 1 = 5.ª). PROVISIONAL.
eje_sin_2_3 = 0.375
# Propuesta automática aproximada (luego se corrige con el clic). Fracciones del largo
# del pie medidas desde el talón; distancias al borde en mm. PROVISIONAL.
propuesta_talon = 0.12
propuesta_mtt1 = 0.72
propuesta_mtt5 = 0.63
propuesta_mtt1_borde = 15.0
propuesta_mtt5_borde = 12.0
# Zona del arco, medida a lo largo del eje del pie desde el talón (0) hasta la línea
# metatarsal (1). Solo el lado interno. PROVISIONAL.
arco_inicio = 0.25
arco_fin = 0.80
